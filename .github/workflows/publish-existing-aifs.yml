name: AIFS · Publicar artefactos ya generados

on:
  push:
    paths:
      - 'PUBLISH-EXISTING-AIFS.txt'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-aifs-candidate
  cancel-in-progress: true

jobs:
  build:
    name: Reutilizar 2.312 mapas · validar · preparar Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      cycle: ${{ steps.meta.outputs.cycle }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Descargar backend vNext
        run: |
          git clone --depth 1 --branch vnext-mapas-profesional \
            https://github.com/parronpintojosemaria-arch/meteorologia-mapas-backend.git backend

      - name: Pillow
        working-directory: backend
        run: pip install --upgrade pillow

      - name: Recuperar los tres grupos AIFS ya generados
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35539627323
          pattern: vnext-aifs-pages-*
          path: backend/vnext-full-merged/aifs
          merge-multiple: true

      - name: Validar de nuevo los 2.312 mapas
        working-directory: backend
        run: python scripts/vnext_aifs_assemble.py

      - id: meta
        name: Recuperar ciclo validado
        working-directory: backend
        shell: bash
        run: |
          CYCLE=$(python -c "import json;print(json.load(open('vnext-full-summary/aifs/report.json'))['cycle'])")
          echo "cycle=$CYCLE" >> "$GITHUB_OUTPUT"
          echo "Ciclo AIFS reutilizado: $CYCLE"

      - name: Preparar sitio
        working-directory: backend
        env:
          CYCLE: ${{ steps.meta.outputs.cycle }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "../site/cycles/$CYCLE"
          cp -a vnext-full-merged/aifs/. "../site/cycles/$CYCLE/"
          python scripts/vnext_current_guard.py \
            --model aifs \
            --cycle "$CYCLE" \
            --cycle-dir vnext-full-merged/aifs \
            --base-url 'https://parronpintojosemaria-arch.github.io/meteorologia-mapas-aifs' \
            --output ../site/current.json
          cat > ../site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Meteorología Interactiva · ECMWF AIFS</title>
          <h1>Meteorología Interactiva · ECMWF AIFS Single v2</h1>
          <p>Datos oficiales: ECMWF Open Data. 2.312 mapas, 0.25°, +360 h.</p>
          <p><a href="current.json">current.json</a></p>
          HTML
          touch ../site/.nojekyll

      - name: Guard final
        env:
          CYCLE: ${{ steps.meta.outputs.cycle }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          c=json.loads(Path('site/current.json').read_text())
          assert c['status']=='ready'
          assert c['model']=='aifs'
          assert c['file_count']==2312
          assert c['cycle']==os.environ['CYCLE']
          assert Path('site/cycles',c['cycle'],'manifest.json').is_file()
          print('AIFS EXISTING ARTIFACTS OK',c['cycle'],c['file_count'])
          PY

      - name: Habilitar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1

  deploy:
    name: Publicar AIFS reutilizado
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar Pages
        id: deployment
        uses: actions/deploy-pages@v4
